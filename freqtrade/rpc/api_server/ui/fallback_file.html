<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freqtrade</title>
    <style>
      :root {
        --bg1: #0e1424;
        --bg2: #0a0d16;
        --text: #e8ecf5;
        --muted: #97a1b8;
        --accent: #5b8cff;
        --accent2: #22d3a6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background: radial-gradient(900px 600px at 80% -10%, rgba(91,140,255,.14), transparent 60%),
          radial-gradient(800px 600px at -10% 110%, rgba(34,211,166,.12), transparent 55%),
          linear-gradient(160deg, var(--bg1), var(--bg2));
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        max-width: 460px;
        width: 100%;
        background: rgba(20, 27, 45, 0.7);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 40px 34px;
        box-shadow: 0 18px 40px -18px rgba(0, 0, 0, 0.65);
        text-align: center;
      }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        display: grid;
        place-items: center;
        font-size: 28px;
        font-weight: 800;
        color: #06131f;
      }
      h1 { font-size: 22px; margin: 0 0 10px; letter-spacing: -0.02em; }
      p { color: var(--muted); line-height: 1.6; margin: 0 0 14px; font-size: 14px; }
      code {
        background: rgba(255, 255, 255, 0.08);
        padding: 2px 7px;
        border-radius: 6px;
        font-size: 13px;
      }
      .btn {
        display: inline-block;
        margin-top: 14px;
        padding: 12px 22px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: #06131f;
        font-weight: 700;
        text-decoration: none;
        font-size: 14px;
      }
      .divider {
        margin: 24px 0 18px;
        border: none;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      .small { font-size: 12.5px; color: #667089; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">F</div>
      <h1>Freqtrade UI not installed</h1>
      <p>
        Run <code>freqtrade install-ui</code> in your terminal to install the
        full FreqUI, then restart your bot and refresh this page.
      </p>
      <hr class="divider" />
      <p class="small">
        Or use the built-in redesigned dashboard — no install required:
      </p>
      <a class="btn" href="/dashboard">Open Dashboard →</a>
    </div>
  </body>
</html>
